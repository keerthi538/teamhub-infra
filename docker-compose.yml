version: "3.9"

services:
  frontend:
    image: ghcr.io/keerthi538/teamhub-frontend:deploy
    restart: always
    networks:
      - app-network

  backend:
    image: ghcr.io/keerthi538/teamhub-backend:deploy
    restart: always
    env_file:
      - .env
    networks:
      - app-network

  collab:
    image: ghcr.io/keerthi538/teamhub-collab-server:deploy
    restart: always
    env_file:
      - .env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
      - collab
    networks:
      - app-network

networks:
  app-network: