services:
  frontend:
    image: ghcr.io/keerthi538/teamhub-frontend:deploy
    restart: always
    networks:
      - app-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    image: ghcr.io/keerthi538/teamhub-backend:deploy
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    networks:
      - app-network

  collab:
    image: ghcr.io/keerthi538/teamhub-collab-server:deploy
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - collab
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres_data:
